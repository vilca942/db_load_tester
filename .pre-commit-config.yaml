repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: poetry-format
        name: ruff-format
        entry: poetry run ruff format
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
        exclude: ^alembic/

      - id: poetry-lock
        name: check-lock
        entry: poetry check --lock
        language: system
        types: [python]
        pass_filenames: false

      - id: poetry-mypy
        name: mypy
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
        exclude: ^alembic/

      - id: poetry-ruff
        name: ruff
        entry: poetry run ruff check --fix
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true
        exclude: ^alembic/
